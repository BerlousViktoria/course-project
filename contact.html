<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зв'яжіться з нами</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css">   
    <link rel="stylesheet" href="assets/css/contact.css">
</head>
<body>
    <div class="grid-lines">
        <div class="line-col"></div>
        <div class="line-col"></div>
        <div class="line-col"></div>
    </div>


    <header class="main-header d-flex">
        <div class="navbar content-wrap d-flex">
            <div class="logo d-flex item-center">
                <img src="assets/images/icons/logo.svg" alt="main logo">
                <span>Interno</span> 
            </div> 
            <div id="iconBlock" class="menu-icon d-flex">
                <div id="iconOpen" class="menu-icon-open"><i class="fa-solid fa-bars"></i></div>
                <div id="iconClose" class="menu-icon-close d-none"><i class="fa-solid fa-xmark"></i></div>
            </div>     
            <ul id="mainMenu" class="main-menu d-flex item-center">
                <li><a href="#">Головна</a></li>
                <li><a href="#">Сторінки</a></li>
                <li><a href="#services">Сервіси</a></li> 
                <li><a href="#projects">Проєкти</a></li>
                <li><a href="#blog">Блог</a></li>
                <li><a href="#contact">Контакти</a></li>
                <li><a href="#"><img src="assets/images/icons/search-icon.svg" alt=""></a></li>
            </ul>     
        </div>
    </header>

    <main>
        <section class="page-banner d-flex item-center">
            <div class="page-banner-card d-flex item-center">
                <h1 class="title">Контакти</h1>
                <p class="subtitle">
                    <a href="index.html">Головна</a> / Контакти
                </p>
            </div>
        </section>

        <section class="contact-section content-wrap">
            <h2 class="title contact-title">Ми раді новим занйомствам і готові вам допомогти.</h2>

            <div class="contact-wrapper d-flex">
                <aside class="contact-card d-flex">
                    <address class="contact-card-info d-flex">
                        <div class="contact-card-item d-flex">
                            <div class="icon-link">
                                <img src="assets/images/icons/email-icon.svg" alt="Пошта">
                            </div>
                            <a href="malito:info@interno.com">info@interno.com</a>
                        </div>
                        <div class="contact-card-info d-flex">
                            <img src="assets/images/icons/phone-icon.svg" alt="Телефон">
                        </div>
                        <a href="tel:+380504001234"></a>
                        <div class="contact-card-info d-flex">
                            <img src="assets/images/icons/planet-icon.svg" alt="Сайт">
                        </div>
                        <a href="https://interno.ua" target="_blank">www.interno.ua</a>
                    </address>

                <div class="social-links d-flex">
                    <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
                        <img src="assets/images/icons/facebook-icon.svg" alt="Facebook">
                    </a>
                    <a href="https://x.com" target="_blank" aria-label="Twitter">
                        <img src="assets/images/icons/twitter-icon.svg" alt="Twitter">
                    </a>
                    <a href="https://ua.linkedin.com" target="_blank" aria-label="LinkedIn">
                        <img src="assets/images/icons/linkedin-icon.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.instagram.com" target="_blank" aria-label="Instagram">
                        <img href="assets/images/icons/instagram-icon.svg" alt="Instagram"></img>
                    </a>
                </div>
                
                <form action="#" class="contact-form d-flex">
                    <div class="contact-form-row d-flex">
                        <div class="form-group">
                            <input type="text" name="name" id="name" placeholder="Ваше ім'я" required>
                            <label for="name" class="d-none">Ваше ім'я</label>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" id="email" placeholder="Електронна пошта" required>
                            <label for="email" class="d-none">Електронна пошта</label>
                        </div>
                        <div class="form-group">
                            <input type="subject" name="subject" id="subject" placeholder="Тема" required>
                            <label for="email" class="d-none">Тема</label>
                        </div>
                        <div class="form-group">
                            <input type="phone" name="phone" id="phone" placeholder="Номер телефону" required>
                            <label for="phone" class="d-none">Номер телефону</label>
                        </div>
                        <div class="form-group full-width">
                            <textarea name="message" id="message" rows="5" part="Добрий день, мене цікавить..."></textarea>
                            <label for="message" class="d-none">Повідомлення</label>
                        </div>
                    </div>

                    <button type="submit" class="btn contact-btn item-center">
                        <span>Надіслати</span>
                            <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.00977 7.93835L14.7329 7.8015M9.62794 1.41431L16.1509 7.93729L9.49654 14.5917" stroke="#CDA274" stroke-width="2" stroke-linecap="square" stroke-linejoin="round"/>
                            </svg>
                    </button>
                </form>
                </aside>
            </div>
        </section>
    </main>
    
</body>
</html>
