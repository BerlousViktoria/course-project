<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід для адміністратора — Interno</title>
    <link rel="stylesheet" href="assets/css/_variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <main class="login-section">
        <div class="login-card">
            <a href="index.html" class="login-logo">
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 34.0003H13.4588V24.499C13.4588 22.4853 15.0898 20.8543 17.1035 20.8543C19.1172 20.8543 20.7482 22.4853 20.7482 24.499V34.0003H33.9975V0C15.2211 0 0 15.2211 0 34.0003Z" fill="#CDA274"/>
                </svg>
                <span>Interno</span>
            </a>

            <h1 id="auth-title">Вхід в систему</h1>
            <p class="login-subtitle">Панель керування студією інтер'єру</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="admin@interno.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="form-group" id="invite-code-group" style="display: none;">
                    <label for="invite-code">Код доступу адміністратора</label>
                    <input type="password" id="invite-code" placeholder="Введіть секретний код">
                </div>                

                <div id="login-error" class="error-message"></div>

                <button type="submit" id="auth-submit-btn" class="login-btn">Увійти</button>
            </form>

            <a href="#" id="toggle-auth-mode" class="back-link">Створити адміністратора</a>
            <a href="index.html" class="back-link">← Повернутися на головну</a>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
</body>
</html>
